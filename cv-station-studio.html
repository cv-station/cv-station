  <meta name="theme-color" content="#0047b3" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <style>
    :root {
      --bg-main: #f3f7fe;
      --bg-card: #ffffff;
      --bg-soft: #eaf2ff;
      --text-primary: #071a3e;
      --text-secondary: #3b5580;
      --text-muted: #6b84ad;
      --royal: #0047b3;
      --royal-dark: #062356;
      --cyan: #00a8e8;
      --emerald: #10b981;
      --gold: #f59e0b;
      --danger: #ef4444;
      --border: #d5e3fb;
      --shadow: 0 8px 24px rgba(6, 35, 86, 0.08);
      --grad: linear-gradient(135deg, #062356 0%, #0047b3 58%, #00a8e8 100%);
      --grad-emerald: linear-gradient(135deg, #047857 0%, #10b981 100%);
      --grad-gold: linear-gradient(135deg, #b45309 0%, #f59e0b 100%);
    }
    html[data-theme="dark"] {
      --bg-main: #061024;
      --bg-card: #0c1b38;
      --bg-soft: #132852;
      --text-primary: #f8fbff;
      --text-secondary: #cbdcf7;
      --text-muted: #8aa6d1;
      --royal: #2d7ff9;
      --cyan: #00d2ff;
      --border: #1e3a6d;
      --shadow: 0 10px 28px rgba(0, 0, 0, 0.45);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { max-width: 100%; overflow-x: hidden; font-family: 'Cairo', sans-serif; background: var(--bg-main); color: var(--text-primary); line-height: 1.6; }

    /* Topbar */
    .topbar {
      position: sticky; top: 0; z-index: 1000;
      background: rgba(255,255,255,0.96); backdrop-filter: blur(12px);
      border-bottom: 1.5px solid var(--border); padding: 10px 16px;
    }
    html[data-theme="dark"] .topbar { background: rgba(12, 27, 56, 0.96); }
    .topbar-inner {
      max-width: 1320px; margin: 0 auto;
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
    }
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand-icon {
      width: 44px; height: 44px; border-radius: 50%; background: #fff;
      border: 2px solid var(--cyan); padding: 2px;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
      overflow: hidden; box-shadow: 0 4px 12px rgba(0,71,179,0.18);
    }
    .brand-icon img { width: 100%; height: 100%; object-fit: contain; border-radius: 50%; }
    .brand-title { font-weight: 900; font-size: 1.05rem; line-height: 1.2; }
    .brand-sub { font-size: 0.74rem; color: var(--text-muted); font-weight: 700; }

    .icon-btn {
      width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--border);
      background: var(--bg-soft); color: var(--text-primary); cursor: pointer;
      display: flex; align-items: center; justify-content: center; font-size: 1.05rem;
    }

    /* Mode Switcher Tabs */
    .tabs-bar {
      max-width: 1320px; margin: 18px auto 0; padding: 0 16px;
      display: flex; gap: 10px; flex-wrap: wrap;
    }
    .tab-btn {
      flex: 1; min-width: 220px; padding: 13px 18px; border-radius: 16px;
      border: 1.5px solid var(--border); background: var(--bg-card); color: var(--text-secondary);
      font-family: 'Cairo', sans-serif; font-weight: 900; font-size: 0.95rem;
      cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px;
      box-shadow: var(--shadow);
    }
    .tab-btn:hover { border-color: var(--royal); }
    .tab-btn.active { background: var(--grad); color: #fff; border-color: transparent; }

    /* Container */
    .container { max-width: 1320px; margin: 0 auto; padding: 18px 16px 60px; }
    .studio-panel { display: none; animation: fadeIn 0.22s ease; }
    .studio-panel.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

    .main-grid {
      display: grid; grid-template-columns: 1fr 1.08fr; gap: 18px; align-items: start;
    }
    @media (max-width: 960px) { .main-grid { grid-template-columns: 1fr; } }

    .card {
      background: var(--bg-card); border: 1.5px solid var(--border);
      border-radius: 20px; padding: 20px; box-shadow: var(--shadow); margin-bottom: 16px;
    }
    .card-title {
      font-size: 1.02rem; font-weight: 900; margin-bottom: 14px;
      display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap;
    }

    /* Form Controls */
    .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(175px, 1fr)); gap: 12px; }
    .field { margin-bottom: 12px; }
    .field:last-child { margin-bottom: 0; }
    .field label { display: block; font-size: 0.8rem; font-weight: 800; color: var(--text-secondary); margin-bottom: 5px; }
    .input, select, textarea {
      width: 100%; padding: 9px 12px; border-radius: 11px;
      border: 1.5px solid var(--border); background: var(--bg-main);
      color: var(--text-primary); font-family: 'Cairo', sans-serif;
      font-size: 0.86rem; font-weight: 700; outline: none; transition: 0.2s;
    }
    .input:focus, select:focus, textarea:focus { border-color: var(--royal); }

    /* Pills */
    .pill-row { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 12px; }
    .pill-btn {
      padding: 6px 13px; border-radius: 999px; border: 1.5px solid var(--border);
      background: var(--bg-soft); color: var(--royal); font-family: 'Cairo', sans-serif;
      font-size: 0.79rem; font-weight: 800; cursor: pointer; transition: 0.2s;
    }
    .pill-btn:hover, .pill-btn.active { background: var(--grad); color: #fff; border-color: transparent; }

    /* Upload Dropzone */
    .upload-box {
      border: 2px dashed var(--royal); border-radius: 14px; padding: 16px;
      text-align: center; background: var(--bg-soft); cursor: pointer;
      transition: 0.2s; display: block;
    }
    .upload-box:hover { background: rgba(0, 71, 179, 0.1); }
    .upload-box input { display: none; }
    .upload-status { font-size: 0.78rem; font-weight: 800; color: var(--emerald); margin-top: 6px; }

    /* Buttons */
    .btn {
      font-family: 'Cairo', sans-serif; font-weight: 800; font-size: 0.88rem;
      padding: 11px 16px; border-radius: 12px; border: none; cursor: pointer;
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      transition: 0.2s; text-decoration: none; white-space: nowrap;
    }
    .btn-primary { background: var(--grad); color: #fff; box-shadow: 0 6px 16px rgba(0,71,179,0.22); }
    .btn-primary:hover { transform: translateY(-1px); }
    .btn-gold { background: var(--grad-gold); color: #fff; box-shadow: 0 6px 16px rgba(245,158,11,0.22); }
    .btn-outline { background: var(--bg-soft); color: var(--royal); border: 1.5px solid var(--border); }

    /* Canvas Preview */
    .canvas-wrap {
      background: var(--bg-soft); border: 1.5px dashed var(--border);
      border-radius: 16px; padding: 14px; text-align: center;
    }
    canvas {
      width: 100%; max-width: 460px; height: auto; border-radius: 14px;
      box-shadow: 0 14px 36px rgba(6, 35, 86, 0.22); display: block; margin: 0 auto;
    }
    canvas.story-preview { max-width: 340px; }

    /* Range Slider */
    input[type="range"] { width: 100%; accent-color: var(--royal); cursor: pointer; }

    /* Toast */
    .toast {
      position: fixed; top: 72px; left: 50%; transform: translateX(-50%);
      background: #062356; color: #fff; padding: 10px 22px; border-radius: 999px;
      font-weight: 800; font-size: 0.84rem; z-index: 9999; display: none;
      box-shadow: 0 10px 28px rgba(0,0,0,0.3); text-align: center;
    }
  </style>
</head>

                  <label>اسم العميل (اختياري)</label>
                  <input type="text" id="revClientName" class="input" value="أ/ محمود خالد" oninput="drawReviewCanvas()" />
                </div>
                <div class="field">
                  <label>المجال / الباقة</label>
                  <input type="text" id="revClientRole" class="input" value="مهندس مدني • باقة الاحتراف" oninput="drawReviewCanvas()" />
                </div>
              </div>
            </div>

            <!-- Screenshot Mode Inputs -->
            <div id="revShotInputs" style="display:none;">
              <div class="field">
                <label class="upload-box">
                  <span style="font-weight:900;color:var(--royal);font-size:0.9rem;">📸 اضغط هنا لرفع سكرين شوت التقييم (واتساب / ماسنجر)</span>
                  <input type="file" accept="image/*" onchange="handleReviewShot(event)" />
                  <div class="upload-status" id="revShotStatus">لم يتم اختيار صورة بعد</div>
                </label>
              </div>
              <div class="field">
                <label>تعليق صغير أسفل السكرين شوت</label>
                <input type="text" id="revShotCaption" class="input" value="ثقة عملائنا هي سر نجاحنا كل يوم ✨" oninput="drawReviewCanvas()" />
              </div>
            </div>

            <div class="field" style="margin-top:12px;">
              <label>الجملة الدعائية في الأسفل (Call to Action)</label>
              <input type="text" id="revFooter" class="input" value="ابعتلنا رسالة دلوقتي وابدأ خطوتك الجاية 🚀" oninput="drawReviewCanvas()" />
            </div>
          </div>
        </div>

        <div class="card">
          <div class="card-title"><span>👁️ المعاينة المباشرة (جودة عالية PNG)</span></div>
          <div class="canvas-wrap">
            <canvas id="reviewCanvas" width="1080" height="1080"></canvas>
          </div>
          <div style="margin-top:14px;display:flex;gap:10px;">
            <button class="btn btn-gold" style="flex:1;padding:13px;font-size:0.95rem;" onclick="downloadCanvas('reviewCanvas', 'CV-Station-Review')">📥 تحميل البوست / الستوري (PNG)</button>
          </div>
        </div>
      </div>
    </section>

    <section id="panel_ba" class="studio-panel">
      <div class="main-grid">
        <!-- Controls -->
        <div>
          <div class="card">
            <div class="card-title"><span>📐 المقاس والستايل</span></div>
            <div class="field">
              <label>مقاس التصميم</label>
              <div class="pill-row">
                <button type="button" class="pill-btn active" id="baSize_post" onclick="setBaSize('post')">🟦 بوست مربع (1080×1080)</button>
                <button type="button" class="pill-btn" id="baSize_story" onclick="setBaSize('story')">📱 ستوري / إعلان (1080×1920)</button>
              </div>
            </div>
            <div class="field">
              <label>ألوان التصميم</label>
              <div class="pill-row" style="margin-bottom:0;">
                <button type="button" class="pill-btn active" id="baTheme_royal" onclick="setBaTheme('royal')">💙 أزرق ملكي</button>
                <button type="button" class="pill-btn" id="baTheme_gold" onclick="setBaTheme('gold')">🖤 أسود وذهبي VIP</button>
                <button type="button" class="pill-btn" id="baTheme_clean" onclick="setBaTheme('clean')">🤍 أبيض عصري</button>
              </div>
            </div>
          </div>

          <div class="card">
            <div class="card-title"><span>📄 رفع صور الـ CV (قبل وبعد)</span></div>
            <div class="form-grid" style="margin-bottom:14px;">
              <label class="upload-box" style="border-color:var(--danger);">
                <span style="font-weight:900;color:var(--danger);font-size:0.86rem;">❌ رفع صورة الـ CV القديم (قبل)</span>
                <input type="file" accept="image/*" onchange="handleBaImage(event, 'before')" />
                <div class="upload-status" id="baBeforeStatus" style="color:var(--text-muted);">اضغط للاختيار</div>
              </label>

              <label class="upload-box" style="border-color:var(--emerald);">
                <span style="font-weight:900;color:var(--emerald);font-size:0.86rem;">✅ رفع صورة الـ CV الجديد (بعد)</span>
                <input type="file" accept="image/*" onchange="handleBaImage(event, 'after')" />
                <div class="upload-status" id="baAfterStatus" style="color:var(--text-muted);">اضغط للاختيار</div>
              </label>
            </div>

            <!-- Privacy Blur Control -->
            <div style="background:var(--bg-soft);padding:12px;border-radius:12px;border:1px solid var(--border);margin-bottom:12px;">
              <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
                <label style="font-size:0.82rem;font-weight:900;color:var(--royal);">🔒 إخفاء بيانات العميل تلقائياً (Blur للخصوصية)</label>
                <input type="checkbox" id="baBlurToggle" checked onchange="drawBaCanvas()" style="width:18px;height:18px;accent-color:var(--royal);cursor:pointer;" />
              </div>
              <label style="font-size:0.75rem;color:var(--text-secondary);font-weight:700;">مساحة التغبيش أعلى الـ CV (لتغطية الاسم والرقم): <strong id="blurPctLabel">16%</strong></label>
              <input type="range" id="baBlurHeight" min="0" max="35" value="16" oninput="document.getElementById('blurPctLabel').textContent=this.value+'%';drawBaCanvas()" />
            </div>

            <div class="field">
              <label>العنوان الرئيسي للتصميم</label>
              <input type="text" id="baHeadline" class="input" value="الفرق بين الـ CV العادي والـ CV المتوافق مع ATS! 🚀" oninput="drawBaCanvas()" />
            </div>
            <div class="field">
              <label>الجملة الدعائية في الأسفل</label>
              <input type="text" id="baFooter" class="input" value="خلّي الـ CV بتاعك يعدّي الـ ATS من أول مرة • ابعتلنا دلوقتي 📩" oninput="drawBaCanvas()" />
            </div>
          </div>
        </div>

        <!-- Preview -->
        <div class="card">
          <div class="card-title"><span>👁️ المعاينة المباشرة (جاهز للإعلانات الممولة)</span></div>
          <div class="canvas-wrap">
            <canvas id="baCanvas" width="1080" height="1080"></canvas>
          </div>
          <div style="margin-top:14px;display:flex;gap:10px;">
            <button class="btn btn-gold" style="flex:1;padding:13px;font-size:0.95rem;" onclick="downloadCanvas('baCanvas', 'CV-Station-Before-After')">📥 تحميل صورة قبل وبعد (PNG)</button>
          </div>
        </div>
      </div>
    </section>

    /* Helpers */
    function roundRect(ctx, x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }

    function drawBgAndHeader(ctx, W, H, th, isStory) {
      const grad = ctx.createLinearGradient(0, 0, W, H);
      grad.addColorStop(0, th.bg1);
      grad.addColorStop(0.55, th.bg2);
      grad.addColorStop(1, th.bg3);
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, W, H);

      // Subtle glow circles
      ctx.save();
      ctx.globalAlpha = th === THEMES.clean ? 0.08 : 0.13;
      ctx.fillStyle = th.accent;
      ctx.beginPath(); ctx.arc(100, 120, 220, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(W - 80, H - 100, 260, 0, Math.PI * 2); ctx.fill();
      ctx.restore();

      // Brand Header
      const topY = isStory ? 130 : 88;
      const logoR = 46;
      const logoX = W - 105;

      ctx.save();
      ctx.beginPath(); ctx.arc(logoX, topY, logoR + 4, 0, Math.PI * 2);
      ctx.fillStyle = th.accent; ctx.fill();
      ctx.beginPath(); ctx.arc(logoX, topY, logoR, 0, Math.PI * 2);
      ctx.clip();
      ctx.fillStyle = '#ffffff'; ctx.fillRect(logoX - logoR, topY - logoR, logoR * 2, logoR * 2);
      if (logoImg.complete) ctx.drawImage(logoImg, logoX - logoR, topY - logoR, logoR * 2, logoR * 2);
      ctx.restore();

      ctx.textAlign = 'right';
      ctx.fillStyle = th.titleCol;
      ctx.font = '900 38px Cairo, sans-serif';
      ctx.fillText('CV Station', W - 172, topY - 4);
      ctx.fillStyle = th.subCol;
      ctx.font = '700 21px Cairo, sans-serif';
      ctx.fillText('ATS Resumes & Career Services', W - 172, topY + 28);
    }

    function wrapTextLines(ctx, text, maxWidth) {
      const paragraphs = text.split('\n');
      const lines = [];
      paragraphs.forEach(p => {
        const words = p.trim().split(/\s+/);
        let cur = '';
        words.forEach(w => {
          const test = cur ? (cur + ' ' + w) : w;
          if (ctx.measureText(test).width > maxWidth && cur) {
            lines.push(cur);
            cur = w;
          } else {
            cur = test;
          }
        });
        if (cur) lines.push(cur);
      });
      return lines;
    }

    function handleReviewShot(ev) {
      const file = ev.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = e => {
        const img = new Image();
        img.onload = () => {
          revShotImg = img;
          document.getElementById('revShotStatus').textContent = '✅ تم رفع الصورة: ' + file.name;
          drawReviewCanvas();
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    function drawReviewCanvas() {
      const c = document.getElementById('reviewCanvas');
      const ctx = c.getContext('2d');
      const W = c.width, H = c.height;
      const isStory = revSize === 'story';
      const th = THEMES[revTheme];

      drawBgAndHeader(ctx, W, H, th, isStory);

      // Top Headline
      const headline = document.getElementById('revHeadline').value.trim();
      ctx.textAlign = 'center';
      ctx.fillStyle = th.accent;
      ctx.font = '900 40px Cairo, sans-serif';
      ctx.fillText(headline, W / 2, isStory ? 310 : 215);

      // Stars
      ctx.fillStyle = th.starCol;
      ctx.font = '900 46px Cairo, sans-serif';
      ctx.fillText('★  ★  ★  ★  ★', W / 2, isStory ? 385 : 278);

      // Main Content Card
      const cardX = 72;
      const cardY = isStory ? 440 : 320;
      const cardW = W - 144;
      const cardH = isStory ? 1140 : 570;

      roundRect(ctx, cardX, cardY, cardW, cardH, 34);
      ctx.fillStyle = th.cardBg; ctx.fill();
      ctx.strokeStyle = th.cardBorder; ctx.lineWidth = 3; ctx.stroke();

      if (revMode === 'text') {
        // Quote Marks
        ctx.fillStyle = th.accent;
        ctx.font = '900 110px Georgia, serif';
        ctx.textAlign = 'right';
        ctx.fillText('“', cardX + cardW - 45, cardY + 115);

        // Wrapped Quote
        const quote = document.getElementById('revQuote').value.trim() || 'اكتب رأي العميل هنا...';
        ctx.textAlign = 'center';
        ctx.fillStyle = th.titleCol;
        ctx.font = isStory ? '800 44px Cairo, sans-serif' : '800 38px Cairo, sans-serif';
        const lines = wrapTextLines(ctx, quote, cardW - 120);
        const lineH = isStory ? 74 : 62;
        const startY = cardY + (cardH - 130) / 2 - ((lines.length - 1) * lineH) / 2 + 20;
        lines.forEach((ln, i) => {
          ctx.fillText(ln, W / 2, startY + i * lineH);
        });

        // Client Name & Role
        const cName = document.getElementById('revClientName').value.trim();
        const cRole = document.getElementById('revClientRole').value.trim();
        ctx.strokeStyle = th.cardBorder; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(cardX + 160, cardY + cardH - 140); ctx.lineTo(cardX + cardW - 160, cardY + cardH - 140); ctx.stroke();

        ctx.fillStyle = th.accent;
        ctx.font = '900 34px Cairo, sans-serif';
        ctx.fillText(cName, W / 2, cardY + cardH - 85);
        ctx.fillStyle = th.subCol;
        ctx.font = '700 25px Cairo, sans-serif';
        ctx.fillText(cRole, W / 2, cardY + cardH - 42);
      } else {
        // Screenshot Mode
        const pad = 42;
        const boxW = cardW - pad * 2;
        const boxH = cardH - pad * 2 - 70;
        if (revShotImg) {
          const scale = Math.min(boxW / revShotImg.width, boxH / revShotImg.height);
          const dw = revShotImg.width * scale;
          const dh = revShotImg.height * scale;
          const dx = cardX + (cardW - dw) / 2;
          const dy = cardY + pad + (boxH - dh) / 2;

          ctx.save();
          roundRect(ctx, dx, dy, dw, dh, 22);
          ctx.clip();
          ctx.drawImage(revShotImg, dx, dy, dw, dh);
          ctx.restore();

          roundRect(ctx, dx, dy, dw, dh, 22);
          ctx.strokeStyle = th.accent; ctx.lineWidth = 4; ctx.stroke();
        } else {
          ctx.textAlign = 'center';
          ctx.fillStyle = th.subCol;
          ctx.font = '800 32px Cairo, sans-serif';
          ctx.fillText('📸 ارفع سكرين شوت المحادثة من اليمين', W / 2, cardY + cardH / 2 - 20);
        }

        const cap = document.getElementById('revShotCaption').value.trim();
        ctx.textAlign = 'center';
        ctx.fillStyle = th.titleCol;
        ctx.font = '800 28px Cairo, sans-serif';
        ctx.fillText(cap, W / 2, cardY + cardH - 36);
      }

      // Footer CTA Pill
      const footer = document.getElementById('revFooter').value.trim();
      const footY = isStory ? H - 180 : H - 92;
      roundRect(ctx, 110, footY - 46, W - 220, 74, 37);
      ctx.fillStyle = th.accent; ctx.fill();

      ctx.textAlign = 'center';
      ctx.fillStyle = revTheme === 'gold' ? '#09090b' : '#ffffff';
      ctx.font = '900 28px Cairo, sans-serif';
      ctx.fillText(footer, W / 2, footY + 2);
    }

    function drawCvSlot(ctx, img, x, y, w, h, badgeText, badgeColor, blurEnabled, blurPct, th) {
      // Frame
      roundRect(ctx, x, y, w, h, 24);
      ctx.fillStyle = '#ffffff'; ctx.fill();
      ctx.strokeStyle = badgeColor; ctx.lineWidth = 5; ctx.stroke();

      if (img) {
        ctx.save();
        roundRect(ctx, x + 4, y + 4, w - 8, h - 8, 20);
        ctx.clip();

        // Cover-fit top aligned (so CV header is always at top)
        const scale = Math.max((w - 8) / img.width, (h - 8) / img.height);
        const dw = img.width * scale;
        const dh = img.height * scale;
        const dx = x + 4 + ((w - 8) - dw) / 2;
        const dy = y + 4;
        ctx.drawImage(img, dx, dy, dw, dh);

        // Privacy Blur over top header
        if (blurEnabled && blurPct > 0) {
          const bh = (h - 8) * (blurPct / 100);
          ctx.save();
          ctx.beginPath();
          ctx.rect(x + 4, y + 4, w - 8, bh);
          ctx.clip();
          ctx.filter = 'blur(14px)';
          ctx.drawImage(img, dx, dy, dw, dh);
          ctx.filter = 'none';
          ctx.fillStyle = 'rgba(255,255,255,0.28)';
          ctx.fillRect(x + 4, y + 4, w - 8, bh);
          ctx.restore();
        }
        ctx.restore();
      } else {
        ctx.textAlign = 'center';
        ctx.fillStyle = '#64748b';
        ctx.font = '800 28px Cairo, sans-serif';
        ctx.fillText('ارفع الصورة هنا', x + w / 2, y + h / 2);
      }

      // Badge Pill at Top Center of Slot
      const bw = 210, bh = 56;
      const bx = x + (w - bw) / 2;
      const by = y - 28;
      roundRect(ctx, bx, by, bw, bh, 28);
      ctx.fillStyle = badgeColor; ctx.fill();
      ctx.textAlign = 'center';
      ctx.fillStyle = '#ffffff';
      ctx.font = '900 28px Cairo, sans-serif';
      ctx.fillText(badgeText, bx + bw / 2, by + 38);
    }

    function drawBaCanvas() {
      const c = document.getElementById('baCanvas');
      const ctx = c.getContext('2d');
      const W = c.width, H = c.height;
      const isStory = baSize === 'story';
      const th = THEMES[baTheme];

      drawBgAndHeader(ctx, W, H, th, isStory);

      // Headline
      const headline = document.getElementById('baHeadline').value.trim();
      ctx.textAlign = 'center';
      ctx.fillStyle = th.titleCol;
      ctx.font = '900 36px Cairo, sans-serif';
      const hLines = wrapTextLines(ctx, headline, W - 120);
      hLines.forEach((ln, i) => {
        ctx.fillText(ln, W / 2, (isStory ? 265 : 200) + i * 48);
      });

      const blurOn = document.getElementById('baBlurToggle').checked;
      const blurPct = Number(document.getElementById('baBlurHeight').value || 0);

      if (!isStory) {
        // Side-by-side (Post 1080x1080)
        // RTL: Right = Before (قبل), Left = After (بعد)
        const slotW = 455, slotH = 620, slotY = 300;
        drawCvSlot(ctx, baBeforeImg, W - 55 - slotW, slotY, slotW, slotH, '❌ قبل', '#ef4444', blurOn, blurPct, th);
        drawCvSlot(ctx, baAfterImg, 55, slotY, slotW, slotH, '✅ بعد', '#10b981', blurOn, blurPct, th);

        // Center Arrow
        ctx.beginPath(); ctx.arc(W / 2, slotY + slotH / 2, 34, 0, Math.PI * 2);
        ctx.fillStyle = th.accent; ctx.fill();
        ctx.textAlign = 'center';
        ctx.fillStyle = baTheme === 'gold' ? '#09090b' : '#ffffff';
        ctx.font = '900 38px Cairo, sans-serif';
        ctx.fillText('←', W / 2, slotY + slotH / 2 + 13);
      } else {
        // Stacked or Wide Side-by-side for Story (1080x1920) -> Side-by-side tall looks super sharp for CVs!
        const slotW = 465, slotH = 1120, slotY = 430;
        drawCvSlot(ctx, baBeforeImg, W - 50 - slotW, slotY, slotW, slotH, '❌ قبل', '#ef4444', blurOn, blurPct, th);
        drawCvSlot(ctx, baAfterImg, 50, slotY, slotW, slotH, '✅ بعد', '#10b981', blurOn, blurPct, th);

        // Center Arrow
        ctx.beginPath(); ctx.arc(W / 2, slotY + slotH / 2, 38, 0, Math.PI * 2);
        ctx.fillStyle = th.accent; ctx.fill();
        ctx.textAlign = 'center';
        ctx.fillStyle = baTheme === 'gold' ? '#09090b' : '#ffffff';
        ctx.font = '900 42px Cairo, sans-serif';
        ctx.fillText('←', W / 2, slotY + slotH / 2 + 14);
      }

      // Footer CTA Pill
      const footer = document.getElementById('baFooter').value.trim();
      const footY = isStory ? H - 170 : H - 72;
      roundRect(ctx, 70, footY - 44, W - 140, 72, 36);
      ctx.fillStyle = th.accent; ctx.fill();

      ctx.textAlign = 'center';
      ctx.fillStyle = baTheme === 'gold' ? '#09090b' : '#ffffff';
      ctx.font = '900 26px Cairo, sans-serif';
      ctx.fillText(footer, W / 2, footY + 2);
    }

    function downloadCanvas(canvasId, prefix) {
      const c = document.getElementById(canvasId);
      const a = document.createElement('a');
      a.download = `${prefix}-${Date.now()}.png`;
      a.href = c.toDataURL('image/png');
      a.click();
      showToast('📥 تم تحميل التصميم بجودة عالية PNG!');
    }

    window.addEventListener('DOMContentLoaded', () => {
      drawReviewCanvas();
      drawBaCanvas();
      if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(() => { drawReviewCanvas(); drawBaCanvas(); });
      }
    });
  </script>
</body>
</html>
